model_list:
  # === Диалог / рефлексия — Gemini 2.5 Pro ===
  - model_name: "dialog"
    litellm_params:
      model: "openai/gemini-2.5-pro"
      api_base: "http://localhost:8888/v1"
      api_key: "ouroboros123"
      max_tokens: 16384

  # === Кодинг — Kimi K2.5 (NVIDIA Build, бесплатно) ===
  - model_name: "coder"
    litellm_params:
      model: "openai/moonshotai/kimi-k2.5"
      api_base: "https://integrate.api.nvidia.com/v1"
      api_key: "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"
      max_tokens: 8192

  # === Ревью / reasoning — Gemini 2.5 Pro (тот же, с thinking) ===
  - model_name: "reviewer"
    litellm_params:
      model: "openai/gemini-2.5-pro"
      api_base: "http://localhost:8888/v1"
      api_key: "ouroboros123"
      max_tokens: 16384

  # === Light / consciousness — Gemini Flash ===
  - model_name: "light"
    litellm_params:
      model: "openai/gemini-2.5-flash"
      api_base: "http://localhost:8888/v1"
      api_key: "ouroboros123"
      max_tokens: 8192

  # === Fallback на всё — Qwen3.5 на Spark ===
  - model_name: "fallback"
    litellm_params:
      model: "openai/qwen3.5:27b"
      api_base: "http://192.168.1.121:11434/v1"
      api_key: "not-needed"
      max_tokens: 16384

  # === Coder fallback — Qwen3-Coder-Next на Spark (когда скачается) ===
  # - model_name: "coder-local"
  #   litellm_params:
  #     model: "openai/qwen3-coder-next"
  #     api_base: "http://192.168.1.121:11434/v1"
  #     api_key: "not-needed"
  #     max_tokens: 16384

  # === Fallback chains ===
  # dialog → fallback
  - model_name: "dialog"
    litellm_params:
      model: "openai/qwen3.5:27b"
      api_base: "http://192.168.1.121:11434/v1"
      api_key: "not-needed"
      max_tokens: 16384

  # coder → fallback
  - model_name: "coder"
    litellm_params:
      model: "openai/qwen3.5:27b"
      api_base: "http://192.168.1.121:11434/v1"
      api_key: "not-needed"
      max_tokens: 16384

  # light → fallback
  - model_name: "light"
    litellm_params:
      model: "openai/qwen3.5:27b"
      api_base: "http://192.168.1.121:11434/v1"
      api_key: "not-needed"
      max_tokens: 16384

router_settings:
  routing_strategy: "simple-shuffle"  # tries first, fallback to second
  num_retries: 2
  retry_after: 5
  timeout: 120
  fallbacks:
    - dialog: ["fallback"]
    - coder: ["fallback"]
    - reviewer: ["fallback"]
    - light: ["fallback"]

general_settings:
  master_key: "sk-litellm-ouroboros"
